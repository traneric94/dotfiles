name: Bug report
description: Report a reproducible bug in these dotfiles.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve these personal dotfiles.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the behavior you saw.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Clone the repo.
        2. Run ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell and version
      placeholder: "zsh 5.9"
    validations:
      required: false
  - type: dropdown
    id: run-mode
    attributes:
      label: How did you run install.sh?
      options:
        - Interactive
        - NON_INTERACTIVE=1
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
    validations:
      required: false
