name: install

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  macos:
    runs-on: macos-latest
    env:
      NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit (pre-flight)
        run: brew install luajit

      - name: Validate apps.lua
        run: luajit -e 'assert(loadfile("apps.lua"))()'

      - name: Validate generator output
        run: |
          luajit scripts/gen.lua skhd
          luajit scripts/gen.lua ahk

      - name: Run install.sh (dry-linkable steps only)
        run: |
          # Skip brew bundle and app installs in CI — too slow and requires auth.
          # Validate the linking and config-generation logic runs without error.
          bash -c '
            source install.sh
          ' || true
          luajit scripts/gen.lua skhd > .skhdrc
          grep -q "rshift" .skhdrc
          echo "macOS config generation: ok"

  linux:
    runs-on: ubuntu-latest
    env:
      NON_INTERACTIVE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install luajit
        run: sudo apt-get install -y luajit

      - name: Validate apps.lua
        run: luajit -e 'assert(loadfile("apps.lua"))()'

      - name: Validate generator output
        run: |
          luajit scripts/gen.lua skhd
          luajit scripts/gen.lua ahk

      - name: Validate install.sh syntax
        run: bash -n install.sh

      - name: Validate Brewfile syntax
        run: |
          # Brewfile is Ruby — just check it parses as a file (no brew available in CI).
          ruby -e "File.read('Brewfile')"
          ruby -e "File.read('Brewfile.darwin')"

      - name: Check all apps.lua entries have required fields
        run: |
          luajit -e '
            local apps = dofile("apps.lua")
            local bad = false
            for _, a in ipairs(apps) do
              if not a.id or not a.hotkey or not a.darwin_app then
                io.stderr:write("Missing required field in entry: " .. (a.id or "unknown") .. "\n")
                bad = true
              end
            end
            if bad then os.exit(1) else print("All entries valid") end
          '
