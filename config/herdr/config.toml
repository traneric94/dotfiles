# Keys documented in HOTKEYS.md (repo root); update it when changing a binding.
# herdr is the primary multiplexer; Ghostty launches it and its Cmd chords send this prefix.
onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
agent_panel_sort = "priority"

[keys]
prefix = "ctrl+b"
split_horizontal = "prefix+minus"
split_vertical   = "prefix+v"
close_tab        = "prefix+ampersand"
workspace_picker = "prefix+s"
settings         = "prefix+shift+s"
goto             = "prefix+f"
edit_scrollback  = "prefix+shift+e"

[[keys.command]]
key = "prefix+g"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" && lazygit"
description = "lazygit in current path"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "cd \"$HOME/notes\" && nvim inbox.md"
description = "Notes inbox"
width = "80%"
height = "80%"
