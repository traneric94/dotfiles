set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

# Better color support
set -g default-terminal "tmux-256color"
# True color via the modern tmux 3.2+ mechanism (replaces the legacy :Tc override).
set -as terminal-features ",xterm-ghostty:RGB"
# Undercurl + colored underlines (terminal capability, not OS-specific).
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Responsive Esc in Vim without corrupting multi-byte escape sequences over slow
# links — tmux-sensible recommends 10ms (imperceptible, but leaves a cushion so
# arrow keys / terminal query replies aren't split across a 0ms window).
set -sg escape-time 10

# Report focus events to apps (nvim autoread / FocusGained on pane switch).
set -g focus-events on

# Keep status/reload messages up long enough to read (default 750ms).
set -g display-time 4000

# Mouse support
set -g mouse on

# Start counting from 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# History limit
set -g history-limit 100000

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Alt + arrows to switch panes (backup navigation)
bind-key -n M-Left select-pane -L
bind-key -n M-Right select-pane -R
bind-key -n M-Up select-pane -U
bind-key -n M-Down select-pane -D

# Shift + arrows to switch windows
bind-key -n S-Left previous-window
bind-key -n S-Right next-window

# Better split commands (v/h)
bind-key v split-window -h -c "#{pane_current_path}"
bind-key h split-window -v -c "#{pane_current_path}"

# Reload config
bind-key r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# vim-like pane resizing  
bind -r C-K resize-pane -U
bind -r C-J resize-pane -D
bind -r C-H resize-pane -L
bind -r C-L resize-pane -R

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# clipboard
set -s set-clipboard on

# Vim mode
setw -g mode-keys vi

# Setup 'v' to begin selection as in Vim; 'y'/Enter copy and exit copy-mode.
# copy-selection-and-cancel routes through `set-clipboard on` (OSC 52), so this
# is cross-platform — no reattach-to-user-namespace shim needed on modern macOS.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @sidebar-tree-command 'tree -a -I ".git|*.swp"'
# Easy open URL
set -g @plugin 'tmux-plugins/tmux-urlview'
# Session save/restore — bindings live in config/tmux/utility.conf
set -g @plugin 'tmux-plugins/tmux-resurrect'
 
# macOS-specific configuration
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# Bell and activity monitoring
set -g bell-action any          # Ring bell for any window
set -g visual-bell off          # Don't use visual bell
set -g monitor-bell on          # Monitor for bell in all windows
set -g activity-action other    # Monitor activity in other windows
set -g visual-activity off      # Don't show activity visually

# Bell styling — message-style is owned by config/tmux/statusline.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
